<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Planetary Orbit</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }

        body {
            background-color: #050814;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Canvas Particle */
        #space-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .header-title {
            text-align: center;
            margin-top: 20px;
            z-index: 10;
            position: relative;
        }

        .header-title h1 {
            font-size: 2.2rem;
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(79, 172, 254, 0.5);
        }

        .header-title p {
            color: #a0aec0;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        /* Orbit Container */
        .universe {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            margin: 40px 0;
        }

        /* Central Sun (Leader / Main Node) */
        .sun {
            position: absolute;
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            background: radial-gradient(circle, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.8), 0 0 100px rgba(79, 172, 254, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 5;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .sun:hover {
            transform: scale(1.1);
        }

        .sun img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
        }

        .sun .name {
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 4px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .sun .role {
            font-size: 0.65rem;
            color: #e2e8f0;
        }

        /* Orbit Rings */
        .orbit {
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            animation: spin infinite linear;
        }

        .universe:hover .orbit {
            animation-play-state: paused; /* បញ្ឈប់ការវិលពេល Hover មើលសមាជិក */
        }

        /* Orbit 1 (Inner) */
        .orbit-1 {
            width: 280px;
            height: 280px;
            animation-duration: 20s;
        }

        /* Orbit 2 (Outer) */
        .orbit-2 {
            width: 480px;
            height: 480px;
            animation-duration: 35s;
            animation-direction: reverse;
        }

        /* Planet Node */
        .planet-node {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
        }

        /* Positioning Planets on the Ring */
        .pos-1 { transform: rotate(0deg) translate(140px) rotate(0deg); }
        .pos-2 { transform: rotate(120deg) translate(140px) rotate(-120deg); }
        .pos-3 { transform: rotate(240deg) translate(140px) rotate(-240deg); }

        .pos-4 { transform: rotate(45deg) translate(240px) rotate(-45deg); }
        .pos-5 { transform: rotate(135deg) translate(240px) rotate(-135deg); }
        .pos-6 { transform: rotate(225deg) translate(240px) rotate(-225deg); }
        .pos-7 { transform: rotate(315deg) translate(240px) rotate(-315deg); }

        .planet {
            width: 65px;
            height: 65px;
            margin-top: -32.5px;
            margin-left: -32.5px;
            border-radius: 50%;
            background: #1a202c;
            border: 2px solid #4facfe;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.4);
            position: relative;
        }

        .planet img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .planet:hover {
            transform: scale(1.3);
            border-color: #00f2fe;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.9);
            z-index: 20;
        }

        /* Planet Label / Tooltip */
        .planet-info {
            position: absolute;
            bottom: -35px;
            white-space: nowrap;
            background: rgba(15, 23, 42, 0.85);
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            pointer-events: none;
        }

        .planet-info .p-name {
            font-size: 0.7rem;
            font-weight: 600;
            color: #fff;
        }

        .planet-info .p-role {
            font-size: 0.6rem;
            color: #38bdf8;
        }

        /* Keyframe Rotation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Counter Rotation for Text readability */
        .orbit-1 .planet { animation: counter-spin 20s infinite linear; }
        .orbit-2 .planet { animation: counter-spin-reverse 35s infinite linear; }

        .universe:hover .planet {
            animation-play-state: paused;
        }

        @keyframes counter-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes counter-spin-reverse {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @media (max-width: 650px) {
            .universe {
                transform: scale(0.65);
                margin: -50px 0;
            }
        }
    </style>
</head>
<body>

    <canvas id="space-bg"></canvas>

    <div class="header-title">
        <h1>រចនាសម្ព័ន្ធក្រុមការងារ</h1>
        <p>យក Cursor ដាក់លើភពដើម្បីពិនិត្យមើលសមាជិក</p>
    </div>

    <div class="universe">
        <!-- Center Node (Team Leader / Sun) -->
        <div class="sun">
            <img src="https://i.pravatar.cc/150?img=68" alt="Leader">
            <div class="name">សុខ ចាន់ដារ៉ា</div>
            <div class="role">Team Leader</div>
        </div>

        <!-- Inner Orbit (Core Members) -->
        <div class="orbit orbit-1">
            <div class="planet-node pos-1">
                <div class="planet">
                    <img src="https://i.pravatar.cc/150?img=32" alt="Member">
                    <div class="planet-info">
                        <div class="p-name">គឹម ស៊ាង</div>
                        <div class="p-role">IoT Engineer</div>
                    </div>
                </div>
            </div>
            <div class="planet-node pos-2">
                <div class="planet">
                    <img src="https://i.pravatar.cc/150?img=47" alt="Member">
                    <div class="planet-info">
                        <div class="p-name">មករា</div>
                        <div class="p-role">Hardware Lead</div>
                    </div>
                </div>
            </div>
            <div class="planet-node pos-3">
                <div class="planet">
                    <img src="https://i.pravatar.cc/150?img=12" alt="Member">
                    <div class="planet-info">
                        <div class="p-name">វឌ្ឍនៈ</div>
                        <div class="p-role">Firmware Dev</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Outer Orbit (Support / Other Members) -->
        <div class="orbit orbit-2">
            <div class="planet-node pos-4">
                <div class="planet">
                    <img src="https://i.pravatar.cc/150?img=5" alt="Member">
                    <div class="planet-info">
                        <div class="p-name">សុភា</div>
                        <div class="p-role">UI/UX Design</div>
                    </div>
                </div>
            </div>
            <div class="planet-node pos-5">
                <div class="planet">
                    <img src="https://i.pravatar.cc/150?img=60" alt="Member">
                    <div class="planet-info">
                        <div class="p-name">រតនៈ</div>
                        <div class="p-role">Backend Dev</div>
                    </div>
                </div>
            </div>
            <div class="planet-node pos-6">
                <div class="planet">
                    <img src="https://i.pravatar.cc/150?img=22" alt="Member">
                    <div class="planet-info">
                        <div class="p-name">លីដា</div>
                        <div class="p-role">Mobile App</div>
                    </div>
                </div>
            </div>
            <div class="planet-node pos-7">
                <div class="planet">
                    <img src="https://i.pravatar.cc/150?img=9" alt="Member">
                    <div class="planet-info">
                        <div class="p-name">តារា</div>
                        <div class="p-role">QA Tester</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Starfield Particles Effect -->
    <script>
        const canvas = document.getElementById('space-bg');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const stars = Array.from({ length: 120 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.5,
            alpha: Math.random(),
            speed: Math.random() * 0.02
        }));

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();

                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) {
                    star.speed = -star.speed;
                }
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();
    </script>
</body>
</html>
