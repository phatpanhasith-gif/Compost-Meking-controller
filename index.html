<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compost Machine Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        
        /* Alert Banner Style */
        .alert-banner { display: none; padding: 15px; margin-bottom: 20px; border-radius: 8px; font-weight: bold; text-align: center; font-size: 1.1em; }
        .alert-warning { background-color: #ffe0e0; color: #d9534f; border: 1px solid #d9534f; animation: blink 1s infinite; }
        .alert-normal { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }

        @keyframes blink { 50% { opacity: 0.7; } }

        .status-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .value { font-size: 2.5em; font-weight: bold; margin: 10px 0; color: #27ae60; }
        .unit { font-size: 0.5em; color: #7f8c8d; }
        .badge { padding: 5px 15px; border-radius: 20px; color: white; font-weight: bold; display: inline-block; }
        .bg-running { background-color: #e67e22; }
        .bg-stopped { background-color: #27ae60; }
        .chart-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 Compost Machine Monitor</h1>

    <!-- Alert Warning Banner -->
    <div id="alertBanner" class="alert-banner"></div>

    <!-- Motor Status -->
    <div class="status-card">
        <h3>Motor Status</h3>
        <span id="motorStatus" class="badge bg-stopped">STOPPED</span>
    </div>

    <!-- Live Sensor Cards -->
    <div class="grid">
        <div class="card">
            <h3>Temperature (DS18B20)</h3>
            <div class="value"><span id="tempVal">--</span> <span class="unit">°C</span></div>
        </div>
        <div class="card">
            <h3>Humidity (DHT22)</h3>
            <div class="value"><span id="humVal">--</span> <span class="unit">%</span></div>
        </div>
    </div>

    <!-- Real-time Chart -->
    <div class="chart-container">
        <canvas id="compostChart"></canvas>
    </div>
</div>

<script>
    const DB_URL = "https://compost-making-machine-default-rtdb.firebaseio.com/compost.json";

    // Chart Setup
    const ctx = document.getElementById('compostChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                { label: 'Temp (°C)', borderColor: '#e74c3c', data: [], fill: false },
                { label: 'Humidity (%)', borderColor: '#3498db', data: [], fill: false }
            ]
        },
        options: { responsive: true, scales: { x: { display: true }, y: { beginAtZero: true } } }
    });

    function updateDashboard() {
        fetch(DB_URL)
            .then(res => res.json())
            .then(data => {
                if (!data) return;

                const temp = parseFloat(data.temp).toFixed(1);
                const hum = parseFloat(data.hum).toFixed(1);
                const isRunning = data.motor === 1 || data.motor === true;

                // Update UI Text
                document.getElementById('tempVal').innerText = temp;
                document.getElementById('humVal').innerText = hum;

                const motorBadge = document.getElementById('motorStatus');
                if (isRunning) {
                    motorBadge.innerText = "RUNNING (Mixing)";
                    motorBadge.className = "badge bg-running";
                } else {
                    motorBadge.innerText = "IDLE (Monitoring)";
                    motorBadge.className = "badge bg-stopped";
                }

                // Check Alarm Conditions
                const alertBanner = document.getElementById('alertBanner');
                let warnings = [];

                if (temp > 60) warnings.push("⚠️ សីតុណ្ហភាពក្តៅពេក (>60°C)");
                if (temp < 30 && temp > 0) warnings.push("⚠️ សីតុណ្ហភាពត្រជាក់ពេក (<30°C)");
                if (hum < 40) warnings.push("⚠️ កម្រិតសំណើមស្ងួតពេក (<40%)");
                if (hum > 70) warnings.push("⚠️ កម្រិតសំណើមសើមពេក (>70%)");

                if (warnings.length > 0) {
                    alertBanner.style.display = "block";
                    alertBanner.className = "alert-banner alert-warning";
                    alertBanner.innerHTML = warnings.join("<br>");
                } else {
                    alertBanner.style.display = "block";
                    alertBanner.className = "alert-banner alert-normal";
                    alertBanner.innerHTML = "✅ ស្ថានភាពជីកំប៉ុសល្អប្រសើរ (Normal Status)";
                }

                // Update Chart Graph
                const now = new Date().toLocaleTimeString();
                if (chart.data.labels.length > 10) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                    chart.data.datasets[1].data.shift();
                }
                chart.data.labels.push(now);
                chart.data.datasets[0].data.push(temp);
                chart.data.datasets[1].data.push(hum);
                chart.update();
            })
            .catch(err => console.error(err));
    }

    // Fetch data every 2 seconds
    setInterval(updateDashboard, 2000);
</script>

</body>
</html>
