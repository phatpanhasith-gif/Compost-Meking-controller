<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMPOST MACHINE CONTROLLER WEB</title>
    <!-- Google Fonts, Icons, Chart.js & Firebase -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --accent-temp: #ff4757;
            --accent-hum: #00d2d3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', 'Kantumruy Pro', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        .dashboard-header { text-align: center; margin-bottom: 30px; }
        .main-title {
            font-size: 2.3rem; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
            background: linear-gradient(90deg, #10ac84 0%, #54a0ff 50%, #ff6b6b 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;
        }
        .team-subtitle { color: var(--text-secondary); font-size: 1.05rem; }
        .team-subtitle strong { color: #ffffff; }

        /* Alert Banner */
        .alert-banner {
            display: none; width: 100%; max-width: 1050px;
            background: rgba(255, 71, 87, 0.15); border: 1px solid #ff4757; color: #ff4757;
            padding: 16px; border-radius: 16px; margin-bottom: 25px; text-align: center; font-weight: 700;
            backdrop-filter: blur(10px); box-shadow: 0 0 25px rgba(255, 71, 87, 0.3);
            animation: pulse-alert 1s infinite alternate;
        }
        @keyframes pulse-alert { from { transform: scale(0.99); } to { transform: scale(1.01); } }

        /* --- Stepped Process Tracker UI --- */
        .tracker-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 28px; padding: 28px; width: 100%; max-width: 1050px;
            backdrop-filter: blur(16px); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        .tracker-header {
            font-size: 1.15rem; font-weight: 700; color: var(--text-primary);
            margin-bottom: 25px; display: flex; align-items: center; gap: 10px;
        }

        .stepper-wrapper {
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .stepper-wrapper::before {
            content: '';
            position: absolute;
            top: 25px;
            left: 5%;
            right: 5%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 1;
        }

        .step-item {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .step-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #1e293b;
            border: 3px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 12px;
            transition: all 0.4s ease;
